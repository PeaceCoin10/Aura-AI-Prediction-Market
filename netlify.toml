# Netlify 永久域名部署配置（git 直连 / CLI 都可用）
[build]
  base = "frontend"
  command = "npm ci --no-audit --no-fund && npm run build"
  publish = "dist"
  environment = { NODE_VERSION = "20" }

# SPA：任何未知路径都回 index.html（前端自己路由）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/insights.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
